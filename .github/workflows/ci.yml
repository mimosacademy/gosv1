name: CI

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Assert legacy backend is absent
        shell: bash
        run: |
          test ! -d apps/pocketbase
          test ! -f apps/web/src/lib/pocketbaseClient.js
          ! grep -Rni --exclude-dir=.git --exclude='*.md' 'pocketbase' apps package.json supabase

      - name: Validate migration tool syntax
        run: python -m py_compile tools/migrate-pocketbase-to-supabase.py

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
