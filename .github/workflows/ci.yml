name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # The committed lockfile currently contains newer semver ranges than
        # apps/web/package.json. npm ci correctly rejects that mismatch. Use
        # npm install here so CI can reconcile the lockfile in the ephemeral
        # runner; dependency lockfile synchronization is tracked separately.
        run: npm install --no-audit --no-fund

      - name: Lint frontend
        run: npm run lint

      - name: Validate PocketBase JavaScript syntax
        shell: bash
        run: |
          find apps/pocketbase/pb_migrations apps/pocketbase/pb_hooks -type f -name '*.js' -print0 \
            | xargs -0 -r -n1 node --check

      - name: Build frontend
        run: npm run build
